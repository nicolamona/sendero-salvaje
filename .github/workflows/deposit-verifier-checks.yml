name: Deposit verifier checks
on:
  pull_request:
    paths: ["services/deposit-verifier/**"]
  push:
    branches: ["feature/deposit-verifier-worker"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/deposit-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
